<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- performance: fonts + external deps -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>

    <!-- typography -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- seo -->
    <title>Shahada App | Learn and Recite the Shahada Online</title>
    <meta name="title" content="Shahada App | Learn and Recite the Shahada Online" />
    <meta name="description" content="Learn and recite the Shahada with real-time Arabic transcription and voice recognition for accurate pronunciation practice. Free interactive Islamic learning tool." />
    <meta name="keywords" content="Shahada, Islam, Arabic, Speech Recognition, Islamic App, Learn Arabic, Pronunciation, Quran, Islamic Education" />
    <meta name="author" content="Mohammed Wahba" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shahada.com/" />

    <!-- open graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shahada.com/" />
    <meta property="og:title" content="Shahada App | Learn and Recite the Shahada Online" />
    <meta property="og:description" content="Learn and recite the Shahada with real-time Arabic transcription and voice recognition for accurate pronunciation practice." />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:site_name" content="Shahada App" />

    <!-- twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shahada App | Learn and Recite the Shahada Online" />
    <meta name="twitter:description" content="Learn and recite the Shahada with real-time Arabic transcription and voice recognition for accurate pronunciation practice." />
    <meta name="twitter:image" content="/preview.png" />

    <!-- theme -->
    <meta name="theme-color" content="#1B1C1E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- pwa -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shahada" />

    <!-- structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Shahada App",
        "url": "https://shahada.com/",
        "description": "Learn and recite the Shahada with real-time speech recognition.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Modern browser with Web Speech API support",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Mohammed Wahba",
          "url": "https://github.com/mohammedwahba2"
        },
        "inLanguage": "en"
      }
    </script>
  </head>

  <body>
    <!-- skip link (a11y) -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded"
    >
      Skip to main content
    </a>

    <div id="root" role="main"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
